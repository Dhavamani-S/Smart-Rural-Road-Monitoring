spring.application.name=backend
server.port=8080
spring.config.import=optional:file:./secrets.properties,optional:file:./backend/secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/smartroad_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=20MB

app.analytics.weight-progress=0.40
app.analytics.weight-budget=0.30
app.analytics.weight-schedule=0.30
app.analytics.healthy-threshold=80
app.analytics.attention-threshold=60
app.analytics.schedule-tolerance-points=5
app.analytics.schedule-penalty-per-point=2.0
app.analytics.missed-milestone-penalty=10
app.analytics.overdue-score-cap=20
app.analytics.budget-tolerance-points=5
app.analytics.budget-penalty-per-point=2.0
app.analytics.over-budget-score-cap=30
app.analytics.stale-update-days=14
app.analytics.delay-review-gap-points=15
app.analytics.delay-severe-gap-points=30
app.analytics.missed-milestone-high-count=3
app.analytics.stale-update-medium-days=30
app.analytics.budget-review-gap-points=15
app.analytics.budget-severe-gap-points=30
app.analytics.near-limit-percent=90
app.analytics.rapid-window-days=14
app.analytics.rapid-spend-multiplier=2.0
app.analytics.rapid-min-percent-of-budget=10
app.analytics.rapid-first-spend-percent-of-budget=30